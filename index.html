<title>Kestrel Station</title>
<style>
:root { --bg:#0a0c0f; --panel:#12151a; --panel2:#1a1e25; --line:#2a3038; --txt:#d6d9dd; --mut:#8a929c; --amb:#e6b04a; --red:#e0503f; --cyn:#5cc8dc; --grn:#79c48a; --sheet:200px; --top:calc(44px + env(safe-area-inset-top)); }
html, body { margin:0; padding:0; background:#000; color:var(--txt); font-family:-apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; height:100%; width:100%; overflow:hidden; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-text-size-adjust:100%; }
#app { position:fixed; inset:0; background:var(--bg); }
button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
[hidden] { display:none !important; }
.mono { font-family:"IBM Plex Mono", Menlo, Consolas, monospace; }
#feed { position:absolute; left:0; top:0; width:100%; height:calc(100% - var(--sheet)); touch-action:none; display:block; background:#111213; }
/* top bar */
#top { position:absolute; top:0; left:0; right:0; height:var(--top); padding:env(safe-area-inset-top) 6px 0; box-sizing:border-box; display:flex; align-items:center; gap:4px; background:linear-gradient(#000d, #0000); pointer-events:none; }
#top > * { pointer-events:auto; }
.tb { background:#0a0c0fcc; border:1px solid var(--line); border-radius:8px; color:var(--txt); font-size:12px; font-weight:600; padding:7px 7px; line-height:1; }
.tb.warn { border-color:var(--red); color:#ffb4ac; } .tb.cyn { border-color:var(--cyn); color:var(--cyn); } .tb.grn { border-color:var(--grn); color:var(--grn); } .tb.pur { border-color:#c9b3ff; color:#c9b3ff; }
#speed { display:flex; gap:0; background:#0a0c0fcc; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-left:auto; }
#speed button { background:transparent; border:none; color:var(--mut); font-size:11px; font-weight:700; padding:7px 6px; font-family:"IBM Plex Mono", Menlo, monospace; }
#speed button.on { background:var(--amb); color:#000; }
#stack { position:absolute; bottom:calc(var(--sheet) + 8px); left:128px; right:10px; display:flex; flex-direction:column; gap:4px; pointer-events:none; }
#stack > * { pointer-events:none; } #hint .k button { pointer-events:auto; }
@media (max-width: 360px) { #stack { left:10px; bottom:calc(var(--sheet) + 136px); } }
#hint { background:#0c0e12ee; border:1px solid var(--amb); border-left-width:3px; border-radius:8px; padding:8px 10px; font-size:12.5px; line-height:1.4; }
#hint .k { font-family:"IBM Plex Mono", Menlo, monospace; font-size:9px; letter-spacing:.12em; color:var(--amb); display:flex; justify-content:space-between; margin-bottom:3px; }
#hint .k button { background:none; border:none; color:var(--mut); font:inherit; padding:0; } #hint .k #tutfold { color:var(--amb); text-align:left; } #hint .body { max-height:6.2em; overflow:hidden; }
#alerts { display:flex; flex-direction:column; gap:4px; pointer-events:none; }
.alert { background:#000c; border-left:3px solid var(--mut); padding:5px 8px; border-radius:4px; font-size:12px; transition:opacity .4s; pointer-events:none; }
.alert.warn { border-color:var(--amb); } .alert.bad { border-color:var(--red); } .alert.ok { border-color:var(--grn); } .alert.out { opacity:0; }
.alert .cs { font-family:"IBM Plex Mono", Menlo, monospace; font-size:9px; letter-spacing:.1em; color:var(--amb); margin-right:6px; }
/* sheet */
#sheet { position:absolute; left:0; right:0; bottom:0; min-height:150px; background:#0c0e12f2; border-top:1px solid var(--line); box-sizing:border-box; padding:6px 10px calc(8px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:6px; }
#sheet:before { content:""; display:block; width:32px; height:3px; background:#39404a; border-radius:2px; margin:0 auto 2px; }
#radio { font-size:11.5px; line-height:1.35; height:44px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
#radio div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#radio .cs.k { color:var(--grn); } #radio .cs.t { color:var(--amb); } #radio .cs.r { color:#c9b3ff; } #radio .cs.g { color:#ffb4ac; }
#status { font-family:"IBM Plex Mono", Menlo, monospace; font-size:10.5px; letter-spacing:.04em; padding:5px 8px; border-radius:6px; background:#161a20; border-left:3px solid var(--mut); color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #status.warn { border-color:var(--amb); } #status.bad { border-color:var(--red); color:#ffb4ac; } #status.ok { border-color:var(--grn); } #status.cyn { border-color:var(--cyn); }

#ctx .k { font-family:"IBM Plex Mono", Menlo, monospace; font-size:9.5px; letter-spacing:.08em; color:var(--amb); }
#ctx .small { font-size:11px; color:var(--mut); }
#ctx .warn { color:#ffb4ac; } #ctx .ok { color:var(--grn); }
#bar { display:flex; gap:5px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.ob { flex:1 1 0; min-width:44px; background:var(--panel2); border:1px solid #39404a; color:var(--txt); border-radius:8px; padding:10px 2px; font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-size:11.5px; font-weight:600; letter-spacing:0; overflow:hidden; text-align:center; }
.ob.on { background:var(--amb); color:#0a0c0f; border-color:var(--amb); } .ob.red { border-color:var(--red); color:#ffb4ac; } .ob.red.on { background:var(--red); color:#fff; } .ob.dim { opacity:.4; } .ob.cyn { border-color:var(--cyn); color:var(--cyn); } .ob.cyn.on { background:var(--cyn); color:#000; }
.ob small { display:block; font-family:"IBM Plex Mono", Menlo, monospace; font-size:8px; font-weight:400; letter-spacing:0; color:var(--mut); margin-top:2px; } .ob.on small { color:#3a2c0c; }
.row { display:flex; flex-wrap:wrap; gap:5px; }

.chip.on { background:var(--amb); color:#0a0c0f; border-color:var(--amb); font-weight:600; } .chip.red.on { background:var(--red); color:#fff; border-color:var(--red); } .chip.dim { opacity:.4; }
.stat3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; } .stat3 div { font-family:"IBM Plex Mono", Menlo, monospace; font-size:9px; color:var(--mut); letter-spacing:.06em; } .stat3 b { display:block; font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-size:17px; font-weight:600; color:var(--txt); letter-spacing:0; }
.stat3 b.red { color:#ffb4ac; } .stat3 b.ok { color:var(--grn); } .stat3 b.amb { color:var(--amb); }
/* menus */
#menu { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 20%, #171b22, #0a0c0f 70%); overflow-y:auto; -webkit-overflow-scrolling:touch; padding:calc(22px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); box-sizing:border-box; }
.card { max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
.title { font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-size:54px; font-weight:600; letter-spacing:.02em; text-align:center; margin-top:10vh; line-height:1; }
.eyebrow { font-family:"IBM Plex Mono", Menlo, monospace; font-size:11px; letter-spacing:.2em; color:var(--amb); text-align:center; }
.sub { text-align:center; color:var(--mut); font-size:13px; margin-bottom:12px; max-width:36ch; margin-left:auto; margin-right:auto; }
.h { font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-size:26px; font-weight:600; margin:6px 0 2px; } .h.win { color:var(--grn); } .h.lose { color:#ffb4ac; }
.mbtn { background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:13px 14px; font-size:16px; text-align:left; }
.mbtn.primary { background:var(--amb); color:#0a0c0f; border-color:var(--amb); font-weight:600; } .mbtn.ghost { background:transparent; color:var(--mut); } .mbtn.danger { color:#ffb4ac; } .mbtn.dim { opacity:.45; }
.mbtn .small { display:block; font-size:12px; color:var(--mut); font-weight:400; margin-top:2px; }
.mbtn.primary .small { color:#3a2c0c; }
.sec { background:#0004; border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.sec .k { font-family:"IBM Plex Mono", Menlo, monospace; font-size:9.5px; letter-spacing:.1em; color:var(--amb); }
.small { font-size:12px; color:var(--mut); }
.brief { font-size:14px; line-height:1.5; background:#0004; border:1px solid var(--line); border-radius:10px; padding:12px; }
.brief b { color:var(--txt); }
.tg { display:flex; gap:10px; align-items:baseline; padding:6px 0; border-bottom:1px solid #1c2128; font-size:13px; } .tg:last-child { border-bottom:none; }
.tg.msel { cursor:pointer; } .tg.msel:active { background:#151a20; } .score { font-family:"IBM Plex Mono", Menlo, monospace; font-size:30px; color:var(--grn); margin:4px 0; } .score .stars { font-size:18px; color:var(--amb); margin-left:10px; }
.tg .st { margin-left:auto; font-family:"IBM Plex Mono", Menlo, monospace; font-size:9.5px; letter-spacing:.06em; color:var(--mut); white-space:nowrap; } .tg .st.ok { color:var(--grn); } .tg .st.amb { color:var(--amb); } .tg .st.red { color:#ffb4ac; }
.tg .t { color:var(--mut); font-size:12px; }
.op { display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:8px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:10px; font-size:13px; }
.op .n { font-family:"Barlow Condensed", "Arial Narrow", sans-serif; font-size:17px; font-weight:600; } .op .cs { font-family:"IBM Plex Mono", Menlo, monospace; font-size:9.5px; color:var(--cyn); letter-spacing:.08em; } .op .kit { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.op .kit .chip { padding:4px 8px; font-size:11px; }
.op .kg { font-family:"IBM Plex Mono", Menlo, monospace; font-size:10px; color:var(--mut); text-align:right; } .op .kg.over { color:#ffb4ac; }
.wbar { grid-column:1 / -1; height:3px; background:#242a32; border-radius:2px; overflow:hidden; } .wbar div { height:100%; background:var(--grn); } .wbar div.over { background:var(--red); }
.led { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; border-bottom:1px solid #1c2128; } .led span:last-child { color:var(--mut); font-family:"IBM Plex Mono", Menlo, monospace; font-size:10px; }
.dbg { font-family:"IBM Plex Mono", Menlo, monospace; font-size:10px; color:var(--mut); text-align:center; margin-top:16px; }
@media (min-width: 700px) { #sheet { max-width:620px; left:50%; transform:translateX(-50%); border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius:16px 16px 0 0; } .card { max-width:560px; } }

<script>
// ===================== KESTREL STATION · DATA =====================
const VERSION = '1.5';
const WORLD = 3000;            // metres, square
const CELL = 3;                // pathfinding cell (m)
const NC = WORLD / CELL;       // cells per side
const DAY = 86400;
const STORE = { save: 'kestrel.save', settings: 'kestrel.settings', campaign: 'kestrel.campaign', best: 'kestrel.best' };

const DIFFICULTY = {

// weapons: range (m), rate (rounds/s), acc (base hit chance at 50 m), dmg, sup (suppression per shot), noise (m heard)

// kit items: weight kg, effect
const KIT = {
  carbine:  { name: 'Suppressed carbine', kg: 5, slot: 'primary', wpn: 'carbine' },
  lmg:      { name: 'LMG + 600 rds', kg: 14, slot: 'primary', wpn: 'lmg' },
  shotgun:  { name: 'Breaching shotgun', kg: 4, slot: 'extra', breach: 1 },
  charge:   { name: 'Breaching charge', kg: 3, slot: 'extra', charge: 1 },
  charge2:  { name: '2× breaching charge', kg: 6, slot: 'extra', charge: 2 },
  med:      { name: 'Med kit', kg: 2, slot: 'extra', med: 1 },
  trauma:   { name: 'Trauma kit ×2', kg: 5, slot: 'extra', med: 3 },
  litter:   { name: 'Litter', kg: 4, slot: 'extra', litter: 1 },
  ladder:   { name: 'Ladder', kg: 6, slot: 'extra', ladder: 1 },
  smoke:    { name: 'Smoke ×2', kg: 1, slot: 'extra', smoke: 2 },
  mags:     { name: 'Extra mags', kg: 3, slot: 'extra', ammo: 90 },
  drone:    { name: 'Hand drone', kg: 2, slot: 'extra', drone: 1 },

  demo:     { name: 'Demolition charge', kg: 5, slot: 'extra', demo: 1 },

  scope:    { name: 'Spotting scope', kg: 2, slot: 'extra', scope: 1 },
  dogkit:   { name: 'Dog harness and camera', kg: 3, slot: 'extra', dog: 1 },
};
const WEIGHT_LIMIT = 32;

const OPERATORS = [
  { id: 'a1', cs: 'ANVIL 1', name: 'Cole',   role: 'Team lead',      skill: 0.85, kit: ['carbine', 'charge', 'med', 'mags'] },
  { id: 'a2', cs: 'ANVIL 2', name: 'Marsh',  role: 'Breacher',       skill: 0.8,  kit: ['carbine', 'shotgun', 'charge2', 'smoke'] },
  { id: 'a3', cs: 'ANVIL 3', name: 'Okafor', role: 'Auto rifleman',  skill: 0.8,  kit: ['lmg', 'smoke', 'mags'] },
  { id: 'a4', cs: 'ANVIL 4', name: 'Reyes',  role: 'Medic',          skill: 0.78, kit: ['carbine', 'trauma', 'litter', 'drone'] },
  { id: 'a5', cs: 'ANVIL 5', name: 'Voss',   role: 'Sniper',         skill: 0.9,  kit: ['rifle', 'scope', 'laser'], sniper: true },
  { id: 'a6', cs: 'ANVIL 6', name: 'Kerr',   role: 'Dog handler',    skill: 0.75, kit: ['carbine', 'dogkit', 'med'], handler: true },
];
const DOG = { cs: 'DIESEL', name: 'Diesel' };
const SEATS = 7;
const RESERVES = [
  { id: 'r1', cs: 'ANVIL 7', name: 'Dunn',   role: 'Rifleman', skill: 0.65, kit: ['carbine', 'med', 'mags'] },
  { id: 'r2', cs: 'ANVIL 8', name: 'Petrov', role: 'Rifleman', skill: 0.62, kit: ['carbine', 'charge', 'smoke'] },
  { id: 'r3', cs: 'ANVIL 9', name: 'Hale',   role: 'Rifleman', skill: 0.6,  kit: ['carbine', 'med', 'mags'] },
];

// air weapons: cde radius (m, casualty-producing), lethal radius, tof (s), building damage, name
const AIRWPN = {
  w105: { name: '105mm', cde: 25, lethal: 12, tof: 14, bld: 1.0, asset: 'gunship', ammo: 12 },
  w40:  { name: '40mm', cde: 12, lethal: 6, tof: 9, bld: 0.35, asset: 'gunship', ammo: 40 },
  w30:  { name: '30mm', cde: 6, lethal: 3, tof: 6, bld: 0.1, asset: 'gunship', ammo: 120 },

const ROE = {
  suppressed: { name: 'Suppressed only', blurb: 'Engage only with suppressed weapons, only when necessary. Slow, quiet.' },
  contact:    { name: 'Weapons free on contact', blurb: 'Full fire once compromised. Faster, louder, more civilian risk.' },
  free:       { name: 'Weapons free', blurb: 'Engage anyone armed on sight. Fast and aggressive.' },

// ledger event weights (conduct points)
const LEDGER = {
  civKilled: { w: 10, text: 'Civilian killed' },
  civWounded: { w: 4, text: 'Civilian wounded' },

const SITE_TYPES = {

  farm:     { name: 'Farm', pop: [0, 2], civ: [3, 5] },
  market:   { name: 'Market', pop: [1, 2], civ: [8, 14] },
  cache:    { name: 'Depot', pop: [3, 6], civ: [0, 1] },
  block:    { name: 'City block', pop: [0, 0], civ: [2, 6] },

// ---------- missions ----------
// Each mission is one sortie on one map. Targets use a fixed vocabulary handled by the simulation:
//   source (meet a source), hvt (capture, alive), ledger (recover from the HVT's house), cache (destroy the sheds holding the cache),
//   checkpoint (neutralise), hostage (rescue), observe (watch a meeting, take nobody), convoy (destroy trucks at the bridge, spare the bus),
//   locate (the dog finds the bomb workshop), reach (walk out to the pick-up).
// req: required for a complete. start: hour of day the sortie opens. carry flags change later missions.
const MISSIONS = [
  { id: 'm1', n: 1, name: 'Rendezvous', map: 'valley', seed: 424242, training: true, start: 20.5, diff: 'easy',
    brief: 'A farmer west of Karat has been passing word through the district officer for months. Tonight he will be at the well house of West Farm. Meet him, hear what he has, and bring the team home. Kestrel walks you through the sensor, the insertion and the exfil.',
    targets: [{ id: 'source', name: 'The source', kind: 'meet', text: 'Rendezvous with the source at the well house of West Farm. Approach quietly; he will not wait for a firefight.', req: true, site: 'WEST FARM' }],
    outcome: { win: 'The farmer talked and went home. He now has a name and a face in the ledger of people who helped you. Whether he is still there when you need him depends on what happens to this valley.', lose: 'The source was not met. He will not try again soon.' } },
  { id: 'm2', n: 2, name: 'Kessen', map: 'valley', seed: 7101, start: 21, popMul: 0.9,
    brief: 'Trucks have been unloading long crates into the sheds of the depot east of the village. Command wants positive identification before anything is struck, and then it wants the depot gone. The checkpoint on the south road is the reinforcement route.',
    targets: [{ id: 'cache', name: 'Weapons depot', kind: 'destroy', text: 'Confirm the cache by sensor or by putting Anvil in the sheds, then destroy it by demolition charge or from the air.', req: true, site: 'DEPOT' },
              { id: 'checkpoint', name: 'Checkpoint', kind: 'neutralise', text: 'Optional. Reinforcements come from the south road checkpoint.', site: 'CHECKPOINT' }],
    outcome: { win: 'The depot burned until morning. Rifles and mortar rounds that were going to the compounds are slag. The network noticed.', lose: 'The depot is still standing. The crates will be moved by the end of the week.' } },
  { id: 'm3', n: 3, name: 'Grey Lantern', map: 'valley', seed: 424242, start: 20.5,
    brief: 'Farid Qasem finances the network from the compounds north and east of Karat. {source:The source says he sleeps at Compound Alpha, main house, with two guards.|Where he sleeps is not known; build intelligence on the compounds before you go in.} Command wants him alive, and it wants his ledger.',
    targets: [{ id: 'hvt', name: 'The financier', kind: 'capture', text: 'Capture Farid Qasem alive. He moves between the compounds by day and sleeps in one of them.', req: true, hvtName: 'QASEM' },
              { id: 'ledger', name: 'The ledger', kind: 'recover', text: 'Recover the network ledger. It will be wherever Qasem sleeps.', req: true }],
    outcome: { win: 'Qasem is in a cell and his ledger is with the analysts. It names a courier, a buyer, and a workshop in the city.', lose: 'Qasem was not taken. The ledger, if it exists, is still in the valley. Command will look elsewhere for the names it needs.' } },
  { id: 'm4', n: 4, name: 'The Crossing', map: 'countryside', seed: 9004, start: 19.5,
    brief: 'Three trucks are coming south to cross the river at the only bridge. They carry the rest of the mortar rounds. A bus from the hill villages will be in the queue at the bridge checkpoint; it does not leave until the trucks do. Stop the trucks. Do not touch the bus.',
    targets: [{ id: 'convoy', name: 'The convoy', kind: 'convoy', text: 'Destroy all three trucks before they cross the bridge. The checkpoint holds them for about forty minutes after they arrive.', req: true, site: 'BRIDGE CHECKPOINT' },
              { id: 'checkpoint', name: 'Bridge checkpoint', kind: 'neutralise', text: 'Optional. The checkpoint crew will defend the trucks.', site: 'BRIDGE CHECKPOINT' }],
    outcome: { win: 'The trucks burned on the north bank. {bus:The bus is a wreck. Command has questions about how that happened.|The bus went on its way with its passengers.}', lose: 'The convoy crossed. The rounds are in the hills now.' } },
  { id: 'm5', n: 5, name: 'Market Day', map: 'village', seed: 9005, start: 9.5, popMul: 0.8,
    brief: 'The ledger names a courier who buys for the network at the Karat market on market day. He walks in from Compound East with two men and leaves before noon. Command wants him alive and talking. The market will be full.',
    targets: [{ id: 'hvt', name: 'The courier', kind: 'capture', text: 'Capture the courier alive. He is at the market until late morning, then walks back to Compound East.', req: true, hvtName: 'THE COURIER', hvtSite: 'MARKET', hvtHome: 'COMPOUND EAST' }],
    outcome: { win: 'The courier talked before the helicopter had landed. He named the house where the network holds the farmer who spoke to you.', lose: 'The courier got away, or did not survive. The market will remember the day either way.' } },
  { id: 'm6', n: 6, name: 'Karat Night', map: 'village', seed: 9006, start: 22, popMul: 1.1,
    brief: '{source:The farmer from West Farm has been taken. The courier says he is held in a house in Dara Village, guarded, and will be moved at first light.|A district official who has been passing information is held in a house in Dara Village and will be moved at first light.} Get him out alive.',
    targets: [{ id: 'hostage', name: 'The hostage', kind: 'rescue', text: 'Find the house, take it, and bring the hostage to the helicopter alive.', req: true, site: 'DARA VILLAGE', known: 'source' }],
    outcome: { win: 'He was on the aircraft when it lifted. He said he had told them nothing. He may even be right.', lose: 'The hostage did not come home. What he knew about you is now known.' } },
  { id: 'm7', n: 7, name: 'High Ground', map: 'countryside', seed: 9007, start: 16.5, popMul: 0.9,
    brief: 'A buyer from the city meets the network at Orchard Compound this evening. Command does not want him taken; it wants to know who he is and where he goes. Put Voss on the ridge, watch the meeting, and take nobody. Anyone you shoot tonight is a name you do not get.',
    targets: [{ id: 'observe', name: 'The meeting', kind: 'observe', text: 'Watch the meeting at Orchard Compound with the sensor or with eyes on the ground. The buyer must leave unharmed.', req: true, site: 'ORCHARD COMPOUND', name2: 'THE BUYER' }],
    outcome: { win: 'The buyer drove back to the city with a face and a car number attached to him. The analysts have his street by morning.', lose: 'The buyer is dead or in a cell, and everything he would have led you to has closed up.' } },
  { id: 'm8', n: 8, name: 'Quarter', map: 'city', seed: 9008, start: 21, popMul: 0.8,
    brief: 'Somewhere in the eastern blocks of the city the network builds its bombs. The sensor cannot see inside. Kerr and Diesel can. Put the dog into the walled workshop yards until he indicates; then get out. This is a reconnaissance, not a raid.',
    targets: [{ id: 'locate', name: 'The workshop', kind: 'locate', text: 'Send Diesel into the buildings of the walled yards east of the hospital until he indicates explosives.', req: true, site: 'WORKSHOP' }],
    outcome: { win: 'Diesel sat at the door and would not move. The workshop is marked.', lose: 'The workshop was not found. The next device is already built.' } },
  { id: 'm9', n: 9, name: 'Rooftops', map: 'city', seed: 9008, start: 1.5, popMul: 1.0,
    brief: 'The workshop is confirmed. Take it: clear the sheds and destroy what is inside. {school:After the school, Angel 61 is not available to you tonight.|Angel 61 is on call.} The hospital across the street is full.',
    targets: [{ id: 'cache', name: 'The workshop', kind: 'destroy', text: 'Clear the workshop and destroy the devices by demolition charge, or strike it from the air with the hospital in mind.', req: true, site: 'WORKSHOP' }],
    outcome: { win: 'The workshop is gone. {hospital:So is part of the hospital.|The hospital never lost power.}', lose: 'The workshop is still working.' } },
  { id: 'm10', n: 10, name: 'The Hospital', map: 'city', seed: 9010, start: 23, popMul: 0.9,
    brief: '{buyer:The buyer you watched at Orchard Compound is in the city hospital tonight, on the second floor, with a guard.|The buyer\'s deputy is in the city hospital tonight, on the second floor, with a guard.} Command wants him alive. The building is protected and it is full of people who are not your enemy.',
    targets: [{ id: 'hvt', name: 'The buyer', kind: 'capture', text: 'Take the buyer alive from the hospital without harming the building or the patients.', req: true, hvtName: 'THE BUYER', hvtSite: 'CITY HOSPITAL' }],
    outcome: { win: 'He walked to the helicopter between two operators. {hospital:The hospital will be a long time forgiving you.|The hospital woke up and found him gone and nothing else changed.}', lose: 'He is not in custody. The hospital is watched now.' } },
  { id: 'm11', n: 11, name: 'Exfil Denied', map: 'countryside', seed: 9011, start: 3, popMul: 1.2, heloDown: true,
    brief: 'Ranger 3 was hit on the run in and put down hard in the fields south of the river. The crew are alive. Everyone in the valley heard it. The pick-up is Ranger 4, at LZ HAWK by the depot on the east side, and it will not come until you are there. Walk out.',
    targets: [{ id: 'reach', name: 'Walk out', kind: 'reach', text: 'Get everyone to LZ HAWK and aboard Ranger 4. The bridge is the only crossing.', req: true }],
    outcome: { win: 'Ranger 4 lifted with everyone who was still alive. It was a long night.', lose: 'Nobody came out of the valley.' } },
  { id: 'm12', n: 12, name: 'The Principal', map: 'valley', seed: 9012, start: 20.5, popMul: 1.6,
    brief: 'The network has one man above Qasem. He has come to Compound Alpha to find out what went wrong, and he has brought his own guards. The compound is a fortress tonight. Command wants him alive, and after twelve missions it is watching everything you do.',
    targets: [{ id: 'hvt', name: 'The principal', kind: 'capture', text: 'Capture the principal alive at Compound Alpha. Expect twice the usual guard.', req: true, hvtName: 'THE PRINCIPAL' },
              { id: 'ledger', name: 'The accounts', kind: 'recover', text: 'Recover the accounts from the main house.', req: true }],
    outcome: { win: 'The principal is in custody. The network in the Karat valley is finished, at least for a while.', lose: 'The principal got away. The valley goes on as it was.' } },
];

// ===================== WORLD =====================
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function rotPt(x, y, cx, cy, a) { const c = Math.cos(a), s = Math.sin(a); return [cx + x * c - y * s, cy + x * s + y * c]; }
function rectPoly(cx, cy, w, h, a) { return [rotPt(-w / 2, -h / 2, cx, cy, a), rotPt(w / 2, -h / 2, cx, cy, a), rotPt(w / 2, h / 2, cx, cy, a), rotPt(-w / 2, h / 2, cx, cy, a)]; }
function polyContains(poly, x, y) { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside; } return inside; }
function polyBounds(poly) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of poly) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } return [x0, y0, x1, y1]; }
function polyCentroid(poly) { let x = 0, y = 0; for (const p of poly) { x += p[0]; y += p[1]; } return [x / poly.length, y / poly.length]; }

// grid cell types
const T_OPEN = 0, T_BLD = 1, T_WALL = 2, T_WATER = 3, T_TREE = 4, T_ROAD = 5, T_ROCK = 6, T_COVER = 7, T_WADI = 8, T_FIELD = 9;
const BLOCKS = new Uint8Array(16); BLOCKS[T_BLD] = 1; BLOCKS[T_WALL] = 1; BLOCKS[T_WATER] = 1; BLOCKS[T_ROCK] = 1; BLOCKS[T_COVER] = 1;
const BLOCKS_LOS = new Uint8Array(16); BLOCKS_LOS[T_BLD] = 1; BLOCKS_LOS[T_WALL] = 1; BLOCKS_LOS[T_ROCK] = 1;
const MOVECOST = new Float32Array(16).fill(1); MOVECOST[T_ROAD] = 0.8; MOVECOST[T_TREE] = 1.7; MOVECOST[T_WADI] = 1.3; MOVECOST[T_FIELD] = 1.1;

class World {
  constructor(seed, kind) {
    this.seed = seed; this.kind = kind || 'valley'; const r = this.r = mulberry(seed);
    this.grid = new Uint8Array(NC * NC);     // cell types
    this.sites = []; this.buildings = []; this.walls = []; this.roads = []; this.trees = []; this.rocks = []; this.fields = []; this.wadi = []; this.water = []; this.breaches = []; this.stalls = []; this.river = null;
    this.gen();
    this.rasterise();
  }
  cell(x, y) { const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL); if (cx < 0 || cy < 0 || cx >= NC || cy >= NC) return T_ROCK; return this.grid[cy * NC + cx]; }
  blocked(x, y) { return BLOCKS[this.cell(x, y)] === 1; }
  // ---------- generation ----------
  gen() {
    if (this.kind === 'village') this.genVillage();
    else if (this.kind === 'countryside') this.genCountry();
    else if (this.kind === 'city') this.genCity();
    else this.genValley();
  }
  // shared scenery: fields by farms/villages, orchards, wadi scrub, random clusters and rock ridges
  decorate(fieldsPerVillage, clusters, rockRuns) {
    const r = this.r;
    for (const s of this.sites) if (s.type === 'farm' || s.type === 'village') for (let i = 0; i < (s.type === 'farm' ? 5 : fieldsPerVillage); i++) { const a = r() * TAU, d = (s.type === 'farm' ? 90 : s.r + 30) + r() * 120; const fx = s.x + Math.cos(a) * d, fy = s.y + Math.sin(a) * d; if (this.river && this.nearPoly(this.river, fx, fy, 40)) continue; this.fields.push({ poly: rectPoly(fx, fy, 60 + r() * 60, 40 + r() * 50, s.rot + (r() - .5) * .4), rows: 4 + Math.floor(r() * 4) }); }
    for (const s of this.sites) if (s.type === 'farm') for (let i = 0; i < 60; i++) { const a = r() * TAU, d = 40 + r() * 110; this.trees.push([s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, 3 + r() * 3]); }
    if (this.wadi.length) for (let i = 0; i < 260; i++) { const k = Math.floor(r() * this.wadi.length); const p = this.wadi[k]; this.trees.push([p[0] + (r() - .5) * 90, p[1] + (r() - .5) * 90, 2 + r() * 3]); }
    if (this.river) for (let i = 0; i < 320; i++) { const k = Math.floor(r() * (this.river.length - 1)); const a = this.river[k], b = this.river[k + 1]; const t = r(); const px = lerp(a[0], b[0], t), py = lerp(a[1], b[1], t); const side = r() < .5 ? -1 : 1; const off = 26 + r() * 50; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; this.trees.push([px - dy / l * off * side, py + dx / l * off * side, 3 + r() * 3]); }
    for (let c = 0; c < clusters; c++) { const cx = r() * WORLD, cy = r() * WORLD; if (this.nearSite(cx, cy, 160)) continue; const n = 4 + Math.floor(r() * 18); for (let i = 0; i < n; i++) this.trees.push([cx + (r() - .5) * 90, cy + (r() - .5) * 90, 2.5 + r() * 3]); }
    for (let c = 0; c < rockRuns; c++) { const cx = r() * WORLD, cy = r() * WORLD; if (this.nearSite(cx, cy, 150) || this.nearRoad(cx, cy, 30)) continue; const n = 3 + Math.floor(r() * 9); const a = r() * TAU; for (let i = 0; i < n; i++) this.rocks.push([cx + Math.cos(a) * i * 9 + (r() - .5) * 12, cy + Math.sin(a) * i * 9 + (r() - .5) * 12, 3 + r() * 5]); }
    this.trees = this.trees.filter(t => t[0] > 10 && t[1] > 10 && t[0] < WORLD - 10 && t[1] < WORLD - 10 && !this.nearRoad(t[0], t[1], 6) && !this.inAnyBuilding(t[0], t[1], 4) && !(this.river && this.nearPoly(this.river, t[0], t[1], 22)));

      H('WHAT YOU ARE', 'You are the operations centre. Kestrel 2 is your drone and its thermal feed is the whole screen. Anvil is a six-man team on the ground: Cole (lead), Marsh (breacher), Okafor (LMG), Reyes (medic), Voss (sniper) and Kerr with Diesel the dog. Ranger 3 is the helicopter and Angel 61 a gunship you can call. Nothing stops you doing anything the assets allow; the ledger records it and command answers at the end of the night.');

      H('THE FEED', 'Drag to slew and flick to send the sensor further; pinch to zoom; double-tap to zoom in on a point. The small map in the corner is the whole area: tap a site on it to slew there, twice to zoom in. Wide view shows site names; medium view builds intelligence on any site under the reticle; narrow view identifies people. Unknowns are amber; identified hostiles red; civilians white. The ⌖ button jumps back to the team. Speed runs at 1×, 4× and 16×; contact drops it to 1×.', 'feed');

      H('COMMANDING ANVIL', 'MOVE and tap the ground. HOLD to stop. BREACH and tap a building: the team goes to it, blows the wall if it must, and clears it room by room (you cannot see inside; they report). SUPPRESS and tap an area for twenty seconds of LMG. EXFIL and tap a landing zone, then CALL RANGER. Three paces: Stealth (half speed, low, hard to see, the team freezes when a sentry looks their way), Patrol, and Rush (fast and loud). The ROE button folds out the rules of engagement. The UNITS row selects Anvil, Voss or Diesel. Tap any person or building on the feed to select it: an identified sentry offers Take down (quiet, from behind, or Voss\'s shot if he can see him); an unarmed person offers Capture.', 'ground');

      H('DIESEL, THE DOG', 'Select Diesel and tap SEND, then a building. He goes in, comes back with the plan of rooms, who is inside and whether the door is rigged, and the plan is drawn over the building. He only deploys when Kerr is fit to go, he can be shot if the compound is awake, and breaching a rigged door without him costs you. RECALL brings him back at any time.', 'dog');

      H('SOUND AND TIME ON TARGET', 'Suppressed shots carry tens of metres, a charge or a rifle hundreds, and the helicopter nearly a kilometre. Dogs at farms and villages give you away at night; villagers who see you by day phone it in. Once a compound is awake the others are phoned within minutes and men come by truck, then a second vehicle if you linger. A compound you have raided sets a night watch. Some targets move in the night: watch the compound or expect a surprise in the clearing.');

  assessStrike(x, y, w) { const g = this.game; const W = AIRWPN[w]; let hos = 0, unk = 0, civ = 0, prot = false, protName = '', fr = 9999; for (const p of g.people) { if (p.dead || p.kind === 'op') continue; const px = p.inside ? g.bld(p.bld).cx : p.x, py = p.inside ? g.bld(p.bld).cy : p.y; if (dist(px, py, x, y) > W.cde) continue; if (p.inside) { const s = g.site(p.site); if (s.intel >= 3 || s.protected) { if (p.kind === 'hos') hos++; else civ++; } else unk++; continue; } if (p.pid === 'hos') hos++; else if (p.pid === 'civ') civ++; else unk++; } for (const b of g.world.buildings) if (b.protected && polyDist(b.poly, x, y) < W.cde) { prot = true; protName = b.name; } for (const o of g.ops()) if (!o.hidden) fr = Math.min(fr, dist(o.x, o.y, x, y)); return { hos, unk, civ, prot, protName, fr }; }

  launch() { const g = this.game, ui = this.ui; if (!ui.insert.lz) { this.toast('TOC', 'Tap the map to choose a landing zone first.', 'warn'); return; } const inj = g.roster.filter(o => !o.kia && o.injured > 0); if (inj.length && ui.launchConfirm !== ui.insert.lz) { ui.launchConfirm = ui.insert.lz; this.toast('TOC', inj.map(o => o.name + ' is injured (' + o.injured + ' day' + (o.injured > 1 ? 's' : '') + ')').join(', ') + '. Tap LAUNCH again to go without ' + (inj.length > 1 ? 'them' : 'him') + ', or rest at BASE.', 'warn'); this.audio.play('warn'); return; } if (g.sanctioned('helo')) ui.insert.lz = { x: 1450, y: 2750 }; if (!g.insert(ui.insert.lz, ui.insert.roe)) { this.toast('TOC', 'Not enough operators fit to go. Rest at base.', 'warn'); return; } ui.preview = { type: 'lz', x: ui.insert.lz.x, y: ui.insert.lz.y, name: 'HAWK' }; this.audio.play('order'); this.setSheet('default'); this.setSpeed(Math.min(this.speed, 4)); }
  // ---------- input ----------
  bind() {
    window.addEventListener('resize', () => { this.r.resize(); }); this.r.resize();

    $('#k9btn').onclick = () => { const g = this.game; const d = g && g.dog(); if (!d) return; this.ui.sel = { kind: 'person', id: d.id }; this.focus(d.x, d.y, Math.max(this.r.cam.zoom, 1.5)); this.updateCtx(); };
    $('#anvilbtn').onclick = () => { const g = this.game; if (!g) return; const L = g.leader(); if (L && g.team.state === 'ground') this.focus(L.x, L.y, Math.max(this.r.cam.zoom, 1.5)); else if (g.team.state === 'inserting' && g.team.lz) this.focus(g.team.lz.x, g.team.lz.y, Math.max(this.r.cam.zoom, 0.8)); };
    for (const b of $('#speed').children) b.onclick = () => { this.audio.init(); this.audio.resume(); this.setSpeed(+b.dataset.s); };
    const cv = this.cv; const ptrs = new Map(); let gesture = null, pinch = null;
    const P = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); this.audio.init(); this.audio.resume(); if (!this.game) return; cv.setPointerCapture(e.pointerId); const [x, y] = P(e); ptrs.set(e.pointerId, { x, y, sx: x, sy: y, t: performance.now(), vx: 0, vy: 0 }); this.fling = null; if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch = { d: dist(a[0].x, a[0].y, a[1].x, a[1].y), zoom: this.r.cam.zoom }; gesture = 'pinch'; return; } gesture = 'tap'; });

    const up = (e) => { if (!ptrs.has(e.pointerId)) return; const [x, y] = P(e); const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if (gesture === 'pinch') { if (!ptrs.size) gesture = null; return; } if (gesture === 'pan' && performance.now() - p.t < 60 && Math.hypot(p.vx, p.vy) > 150) this.fling = { vx: clamp(p.vx, -5000, 5000), vy: clamp(p.vy, -5000, 5000) }; if (gesture === 'tap' && this.game && !this.paused) { const now = performance.now(); if (this.lastTap && now - this.lastTap.t < 320 && dist(x, y, this.lastTap.x, this.lastTap.y) < 24) { this.lastTap = null; const [wx, wy] = this.r.s2w(x, y); this.r.cam.zoom = clamp(this.r.cam.zoom * 2.2, 0.12, 20); const [nx, ny] = this.r.s2w(x, y); this.r.cam.x += wx - nx; this.r.cam.y += wy - ny; this.r.clampCam(); } else { this.lastTap = { x, y, t: now }; this.onTap(x, y); } } gesture = null; };

  }
  onTap(sx, sy) {
    const g = this.game, ui = this.ui; const T = g.team;
    const mr = this.r.miniRect; if (mr && sx >= mr[0] && sx <= mr[0] + mr[2] && sy >= mr[1] && sy <= mr[1] + mr[3]) { const k = WORLD / mr[2]; const tx = (sx - mr[0]) * k, ty = (sy - mr[1]) * k; const site = g.world.sites.find(s2 => !(s2.type === 'block' && !s2.armed) && dist(s2.x, s2.y, tx, ty) < 140); const now = performance.now(); if (this.lastMini && now - this.lastMini < 400) this.focus(site ? site.x : tx, site ? site.y : ty, 0.7); else this.focus(site ? site.x : tx, site ? site.y : ty); this.lastMini = now; this.audio.play('select'); return; }

    if (ui.mode === 'suppress') { if (g.order({ type: 'suppress', x: wx, y: wy })) this.audio.play('order'); this.setMode(null); return; }
    if (ui.mode === 'overwatch') { const c = g.world.coverAt(wx, wy, wx + 30, wy) + g.world.coverAt(wx, wy, wx - 30, wy) + g.world.coverAt(wx, wy, wx, wy + 30) + g.world.coverAt(wx, wy, wx, wy - 30); ui.preview = { type: 'ow', x: wx, y: wy, cover: c > 0.4 }; this.audio.play('select'); this.updateCtx(); return; }

    const pick = 12 / this.r.cam.zoom; let best = null, bd = pick; for (const p of g.people) { if (p.dead || p.inside || p.hidden || p.aboard) continue; const d = dist(p.x, p.y, wx, wy); if (d < bd) { bd = d; best = p; } }

  }
