<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0a0c0f"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>Kestrel Station</title>
<style>

<script>
// ===================== KESTREL STATION · DATA =====================

const CELL = 3;                // pathfinding cell (m)

// ===================== WORLD =====================
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function rotPt(x, y, cx, cy, a) { const c = Math.cos(a), s = Math.sin(a); return [cx + x * c - y * s, cy + x * s + y * c]; }
function rectPoly(cx, cy, w, h, a) { return [rotPt(-w / 2, -h / 2, cx, cy, a), rotPt(w / 2, -h / 2, cx, cy, a), rotPt(w / 2, h / 2, cx, cy, a), rotPt(-w / 2, h / 2, cx, cy, a)]; }
function polyContains(poly, x, y) { let inside = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside; } return inside; }
function polyBounds(poly) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of poly) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } return [x0, y0, x1, y1]; }
function polyCentroid(poly) { let x = 0, y = 0; for (const p of poly) { x += p[0]; y += p[1]; } return [x / poly.length, y / poly.length]; }

// grid cell types

    if (s.kind === 'person') { const p = g.byId.get(s.id); if (!p || p.dead) { ui.sel = null; return ''; } const who = p.kind === 'op' ? p.cs + ' · ' + p.name : p.captured ? (p.hvt ? 'Detainee · Qasem' : 'Detainee') : p.pid === 'hos' ? 'Hostile · ' + WPN[p.wpn].name.toLowerCase() : p.pid === 'civ' ? 'Unarmed · civilian' : 'Unknown · ' + (this.r.cam.zoom >= 1 ? 'identifying' : 'zoom in to identify'); h += '<div class="k">SELECTED</div><div>' + who + (p.down ? ' · <span class="warn">down' + (p.kind === 'op' ? (p.stable ? ', stable' : ', bleeding ' + fmtT(p.bleed)) : '') + '</span>' : '') + '</div><div class="row"><button class="chip" data-act="focus">Focus</button>' + (T.state === 'ground' && p.kind !== 'op' && !p.captured && (p.pid === 'civ' || p.down) ? '<button class="chip" data-act="capture">Capture</button>' : '') + (T.state === 'ground' && p.pid === 'hos' && !p.down && !p.inside && g.site(p.site).compromisedAt < 0 ? '<button class="chip" data-act="takedown">Take down</button>' : '') + '<button class="chip red" data-act="strike">Strike here</button><button class="chip" data-act="clear">Clear</button></div>'; }
    else if (s.kind === 'bld') { const b = g.bld(s.id); const st = g.site(b.site); h += '<div class="k">SELECTED</div><div>' + b.name + ' · ' + st.name + (b.protected ? ' · <span class="ok">PROTECTED</span>' : '') + (b.destroyed ? ' · <span class="warn">destroyed</span>' : b.dmg > 0.15 ? ' · damaged' : '') + (b.cleared ? ' · cleared' : '') + (st.intel >= 3 ? ' · ' + b.occupants.length + ' inside' : '') + '</div><div class="row"><button class="chip" data-act="focus">Focus</button>' + (T.state === 'ground' && !b.destroyed ? '<button class="chip" data-act="breach">Breach</button>' : '') + '<button class="chip red" data-act="strike">Strike here</button><button class="chip" data-act="clear">Clear</button></div>'; }
    return h;
  }
  selAction(a) { const g = this.game, ui = this.ui; const s = ui.sel; if (!s) return; let x, y; if (s.kind === 'person') { const p = g.byId.get(s.id); if (!p) return; x = p.x; y = p.y; } else { const b = g.bld(s.id); x = b.cx; y = b.cy; }
    if (a === 'focus') this.focus(x, y, Math.max(this.r.cam.zoom, 1.2)); else if (a === 'clear') { ui.sel = null; this.updateCtx(); } else if (a === 'strike') { ui.preview = { type: 'strike', x, y, w: ui.air.w }; this.setSheet('air'); } else if (a === 'takedown') { g.order({ type: 'takedown', pid: s.id }); this.audio.play('order'); ui.sel = null; this.renderSheet(); } else if (a === 'capture') { g.order({ type: 'capture', pid: s.id }); this.audio.play('order'); ui.sel = null; this.updateCtx(); } else if (a === 'breach') { ui.mode = 'breach'; ui.breach = { bld: s.id, explosive: false }; ui.sel = null; this.renderSheet(); } }
  assessStrike(x, y, w) { const g = this.game; const W = AIRWPN[w]; let hos = 0, unk = 0, civ = 0, prot = false, protName = '', fr = 9999; for (const p of g.people) { if (p.dead || p.kind === 'op') continue; const px = p.inside ? g.bld(p.bld).cx : p.x, py = p.inside ? g.bld(p.bld).cy : p.y; if (dist(px, py, x, y) > W.cde) continue; if (p.inside) { const s = g.site(p.site); if (s.intel >= 3 || s.protected) { if (p.kind === 'hos') hos++; else civ++; } else unk++; continue; } if (p.pid === 'hos') hos++; else if (p.pid === 'civ') civ++; else unk++; } for (const b of g.world.buildings) if (b.protected && polyDist(b.poly, x, y) < W.cde) { prot = true; protName = b.name; } for (const o of g.ops()) if (!o.hidden) fr = Math.min(fr, dist(o.x, o.y, x, y)); return { hos, unk, civ, prot, protName, fr }; }
  confirmStrike() { const g = this.game, ui = this.ui; const pv = ui.preview; if (!pv || pv.type !== 'strike') return; const err = g.callForFire(ui.air.w, pv.x, pv.y); if (err) { this.toast('TOC', err, 'warn'); return; } this.audio.play('order'); ui.preview = null; ui.mode = null; this.setSheet(g.team.state === 'ground' ? 'ground' : 'default'); }
  launch() { const g = this.game, ui = this.ui; if (!ui.insert.lz) return; if (g.sanctioned('helo')) ui.insert.lz = { x: 1450, y: 2750 }; if (!g.insert(ui.insert.lz, ui.insert.roe)) { this.toast('TOC', 'Not enough operators fit to go. Rest at base.', 'warn'); return; } ui.preview = { type: 'lz', x: ui.insert.lz.x, y: ui.insert.lz.y, name: 'HAWK' }; this.audio.play('order'); this.setSheet('default'); this.setSpeed(Math.min(this.speed, 4)); }
  // ---------- input ----------
  bind() {
    window.addEventListener('resize', () => { this.r.resize(); }); this.r.resize();
    $('#pausebtn').onclick = () => { if (!this.game) return; this.save(); this.showMenu('pause'); };
    $('#tasksbtn').onclick = () => { if (!this.game) return; this.showMenu('tasks'); };
    $('#anvilbtn').onclick = () => { const g = this.game; if (!g) return; const L = g.leader(); if (L && g.team.state === 'ground') this.focus(L.x, L.y, Math.max(this.r.cam.zoom, 1.5)); else if (g.team.state === 'inserting' && g.team.lz) this.focus(g.team.lz.x, g.team.lz.y, Math.max(this.r.cam.zoom, 0.8)); };
    for (const b of $('#speed').children) b.onclick = () => { this.audio.init(); this.audio.resume(); this.setSpeed(+b.dataset.s); };
    const cv = this.cv; const ptrs = new Map(); let gesture = null, pinch = null;
    const P = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { e.preventDefault(); this.audio.init(); this.audio.resume(); if (!this.game) return; cv.setPointerCapture(e.pointerId); const [x, y] = P(e); ptrs.set(e.pointerId, { x, y, sx: x, sy: y, t: performance.now(), vx: 0, vy: 0 }); this.fling = null; if (ptrs.size === 2) { const a = [...ptrs.values()]; pinch = { d: dist(a[0].x, a[0].y, a[1].x, a[1].y), zoom: this.r.cam.zoom }; gesture = 'pinch'; return; } gesture = 'tap'; });
    cv.addEventListener('pointermove', (e) => { if (!this.game || !ptrs.has(e.pointerId)) return; const [x, y] = P(e); const p = ptrs.get(e.pointerId); if (gesture === 'pinch' && ptrs.size === 2) { p.x = x; p.y = y; const a = [...ptrs.values()]; const d = dist(a[0].x, a[0].y, a[1].x, a[1].y); const cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2; const [wx, wy] = this.r.s2w(cx, cy); this.r.cam.zoom = clamp(pinch.zoom * d / pinch.d, 0.12, 20); const [nx, ny] = this.r.s2w(cx, cy); this.r.cam.x += wx - nx; this.r.cam.y += wy - ny; this.r.clampCam(); return; } const dx = x - p.x, dy = y - p.y; const now = performance.now(); const dt = Math.max(1, now - p.t); p.vx = 0.7 * p.vx + 0.3 * dx / dt * 1000; p.vy = 0.7 * p.vy + 0.3 * dy / dt * 1000; p.t = now; p.x = x; p.y = y; if (gesture === 'tap' && dist(x, y, p.sx, p.sy) > 8) gesture = 'pan'; if (gesture === 'pan') { this.r.cam.x -= dx / this.r.cam.zoom; this.r.cam.y -= dy / this.r.cam.zoom; this.r.clampCam(); } });
    const up = (e) => { if (!ptrs.has(e.pointerId)) return; const [x, y] = P(e); const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if (gesture === 'pinch') { if (!ptrs.size) gesture = null; return; } if (gesture === 'pan' && performance.now() - p.t < 60 && Math.hypot(p.vx, p.vy) > 150) this.fling = { vx: clamp(p.vx, -5000, 5000), vy: clamp(p.vy, -5000, 5000) }; if (gesture === 'tap' && this.game && !this.paused) { const now = performance.now(); if (this.lastTap && now - this.lastTap.t < 320 && dist(x, y, this.lastTap.x, this.lastTap.y) < 24) { this.lastTap = null; const [wx, wy] = this.r.s2w(x, y); this.r.cam.zoom = clamp(this.r.cam.zoom * 2.2, 0.12, 20); const [nx, ny] = this.r.s2w(x, y); this.r.cam.x += wx - nx; this.r.cam.y += wy - ny; this.r.clampCam(); } else { this.lastTap = { x, y, t: now }; this.onTap(x, y); } } gesture = null; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('wheel', (e) => { e.preventDefault(); this.r.cam.zoom = clamp(this.r.cam.zoom * (e.deltaY < 0 ? 1.12 : 0.89), 0.12, 20); this.r.clampCam(); }, { passive: false });
    window.addEventListener('keydown', (e) => { if (!this.game) return; if (e.key === ' ') { this.setSpeed(this.speed ? 0 : 1); e.preventDefault(); } });
  }
  onTap(sx, sy) {
    const g = this.game, ui = this.ui; const [wx, wy] = this.r.s2w(sx, sy); const T = g.team;
    if (ui.sheet === 'insert') { ui.insert.lz = { x: wx, y: wy }; ui.preview = { type: 'lz', x: wx, y: wy, name: 'HAWK' }; this.audio.play('select'); this.renderSheet(); return; }
    if (ui.sheet === 'air') { ui.preview = { type: 'strike', x: wx, y: wy, w: ui.air.w }; this.audio.play('select'); this.renderSheet(); return; }
    if (ui.mode === 'move') { if (g.order({ type: 'move', x: wx, y: wy })) this.audio.play('order'); this.setMode(null); return; }
    if (ui.mode === 'suppress') { if (g.order({ type: 'suppress', x: wx, y: wy })) this.audio.play('order'); this.setMode(null); return; }
    if (ui.mode === 'exfil') { ui.preview = { type: 'lz', x: wx, y: wy, name: 'EXFIL' }; this.audio.play('select'); this.updateCtx(); return; }
    if (ui.mode === 'breach') { const b = g.world.buildingAt(wx, wy, 3 / this.r.cam.zoom); if (b) { ui.breach = { bld: b.id, explosive: false }; this.audio.play('select'); this.updateCtx(); } return; }
    // selection
    const pick = 12 / this.r.cam.zoom; let best = null, bd = pick; for (const p of g.people) { if (p.dead || p.inside || p.hidden || p.aboard) continue; const d = dist(p.x, p.y, wx, wy); if (d < bd) { bd = d; best = p; } }
    if (best) { ui.sel = { kind: 'person', id: best.id }; this.audio.play('select'); this.updateCtx(); return; }
    const b = g.world.buildingAt(wx, wy, 2 / this.r.cam.zoom); if (b) { ui.sel = { kind: 'bld', id: b.id }; this.audio.play('select'); this.updateCtx(); return; }
    if (ui.sel) { ui.sel = null; this.updateCtx(); }
  }
}
